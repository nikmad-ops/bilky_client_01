name: Bilky Status

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram chat id requesting status'
        required: true
        type: string
      mode:
        description: 'status or read-only'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - read-only

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Authorize Telegram chat
        id: auth
        env:
          REQUEST_CHAT_ID: ${{ inputs.chat_id }}
          CLIENT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${REQUEST_CHAT_ID}" = "${CLIENT_CHAT_ID}" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "recipient=client" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${REQUEST_CHAT_ID}" = "${ADMIN_CHAT_ID}" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "recipient=admin" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unauthorized Telegram chat_id."
          echo "allowed=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.auth.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.auth.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.auth.outputs.allowed == 'true'
        run: npm install

      - name: Read Bilky weekly status
        if: steps.auth.outputs.allowed == 'true' && inputs.mode == 'status'
        env:
          REQUEST_CHAT_ID: ${{ inputs.chat_id }}
          REQUEST_RECIPIENT: ${{ steps.auth.outputs.recipient }}
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: npm run status

      - name: Read current Bilky card only
        if: steps.auth.outputs.allowed == 'true' && inputs.mode == 'read-only'
        env:
          BILKY_NIF: ${{ secrets.BILKY_NIF }}
          BILKY_PASSWORD: ${{ secrets.BILKY_PASSWORD }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          ADMIN_TELEGRAM_BOT_TOKEN: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: node src/read-only.js
